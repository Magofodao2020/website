<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#08080a" />
    <meta name="description" content="Executor do Painel do BOPE." />
    <meta name="robots" content="noindex" />
    <link rel="icon" type="image/png" sizes="32x32" href="./bope-32.png" />
    <link rel="icon" type="image/png" sizes="64x64" href="./bope-64.png" />
    <link rel="apple-touch-icon" href="./bope-180.png" />
    <title>Executor — Painel do BOPE</title>
    <script>
      // Dentro do painel (aba Executor) a página roda num iframe: some o cabeçalho próprio.
      if (window.self !== window.top || /[?&]embed=1\b/.test(location.search)) document.documentElement.classList.add('embed');
    </script>
    <style>
      @font-face { font-family: Bricolage; src: url(./assets/bricolage-latin-DLoelf7F.woff2) format("woff2"); font-weight: 200 800; font-display: swap; unicode-range: U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+2000-206F,U+2074,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD; }
      @font-face { font-family: Bricolage; src: url(./assets/bricolage-latin-ext-CcLUaPy7.woff2) format("woff2"); font-weight: 200 800; font-display: swap; unicode-range: U+0100-02AF,U+0304,U+0308,U+0329,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF; }
      @font-face { font-family: "Martian Mono"; src: url(./assets/martian-400-DZsjfPjH.woff2) format("woff2"); font-weight: 400; font-display: swap; }
      @font-face { font-family: "Martian Mono"; src: url(./assets/martian-500-BWC8e-kx.woff2) format("woff2"); font-weight: 500; font-display: swap; }

      /* Mesmos tokens do painel (assets/index-*.css) */
      :root {
        color-scheme: dark;
        --bg: #08080a; --bg-2: #0d0d10; --surface: #131316; --surface-2: #19191d; --surface-3: #212126;
        --border: #26262c; --border-strong: #34343b;
        --text: #f4f4f5; --text-2: #b4b4bc; --text-3: #7c7c86;
        --red: #e5141b; --red-hover: #f42a30; --red-soft: rgba(229,20,27,.12); --red-line: rgba(229,20,27,.38);
        --gold: #e5c400; --gold-soft: rgba(229,196,0,.12);
        --green: #22c55e; --green-soft: rgba(34,197,94,.12);
        --amber: #f59e0b; --amber-soft: rgba(245,158,11,.12);
        --radius: 14px; --radius-sm: 9px;
        --font: "Bricolage", ui-sans-serif, system-ui, "Segoe UI", Roboto, sans-serif;
        --mono: "Martian Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; }
      body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.5 var(--font); -webkit-font-smoothing: antialiased; overflow: hidden; }
      button, input { font: inherit; color: inherit; }
      :focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
      ::selection { background: var(--red-line); }
      ::-webkit-scrollbar { width: 10px; height: 10px; }
      ::-webkit-scrollbar-thumb { background: var(--surface-3); border-radius: 10px; border: 2px solid var(--bg); }
      svg.i { width: 16px; height: 16px; flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

      .app { display: flex; flex-direction: column; height: 100%; min-height: 0; }

      /* Cabeçalho só na página avulsa (/executor) */
      .x-head { display: flex; align-items: center; gap: 14px; padding: 0 28px; min-height: 76px; border-bottom: 1px solid var(--border); background: linear-gradient(180deg,#0c0c0f,#09090b); }
      .x-head img { width: 40px; height: 40px; }
      .x-brand { line-height: 1.15; }
      .x-brand .t { font-weight: 800; letter-spacing: .18em; font-size: 15px; }
      .x-brand .t span { color: var(--red); }
      .x-brand .s { font-size: 11px; letter-spacing: .22em; text-transform: uppercase; color: var(--gold); }
      .x-head .right { margin-left: auto; display: flex; align-items: center; gap: 10px; }
      html.embed .x-head { display: none; }

      .body { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 16px; padding: 20px 28px 24px; }

      .toolbar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
      .toolbar .spacer { flex: 1; }

      .chip { display: inline-flex; align-items: center; gap: 7px; height: 28px; padding: 0 11px; border-radius: 99px; font-size: 12.5px; font-weight: 600; border: 1px solid var(--border); background: var(--surface); color: var(--text-2); white-space: nowrap; }
      .chip .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--text-3); flex: none; }
      .chip.on { color: #86efac; border-color: rgba(34,197,94,.3); background: var(--green-soft); }
      .chip.on .dot { background: var(--green); box-shadow: 0 0 0 3px rgba(34,197,94,.18); }
      .chip.idle { color: #fcd34d; border-color: rgba(245,158,11,.3); background: var(--amber-soft); }
      .chip.idle .dot { background: var(--amber); }
      .chip.err { color: #ff8a8d; border-color: var(--red-line); background: var(--red-soft); }
      .chip.err .dot { background: var(--red); }

      .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 38px; padding: 0 15px; border-radius: 10px; border: 1px solid var(--border-strong); background: var(--surface-2); color: var(--text); font-weight: 600; font-size: 13.5px; cursor: pointer; white-space: nowrap; text-decoration: none; transition: background .12s, border-color .12s, color .12s; }
      .btn:hover { background: var(--surface-3); }
      .btn-primary { background: var(--red); border-color: var(--red); color: #fff; box-shadow: 0 4px 16px rgba(229,20,27,.25); }
      .btn-primary:hover { background: var(--red-hover); border-color: var(--red-hover); }
      .btn-gold { color: var(--gold); border-color: rgba(229,196,0,.35); background: var(--gold-soft); }
      .btn-gold:hover { background: rgba(229,196,0,.2); }
      .btn-ghost { background: transparent; border-color: transparent; color: var(--text-2); }
      .btn-ghost:hover { background: var(--surface-2); color: var(--text); }
      .btn-sm { height: 32px; padding: 0 11px; font-size: 12.5px; border-radius: 8px; }
      kbd { font-family: var(--mono); font-size: 10.5px; padding: 1px 5px; border-radius: 5px; border: 1px solid currentColor; opacity: .7; font-weight: 500; }

      .notice { display: none; gap: 12px; align-items: flex-start; padding: 12px 14px; border-radius: 12px; border: 1px solid var(--red-line); background: var(--red-soft); font-size: 13px; color: var(--text-2); }
      .notice.show { display: flex; }
      .notice svg { color: var(--red); width: 18px; height: 18px; margin-top: 1px; }
      .notice strong { color: var(--text); }
      .notice code { font-family: var(--mono); font-size: 11.5px; background: var(--bg-2); border: 1px solid var(--border); padding: 1px 6px; border-radius: 6px; color: var(--text); word-break: break-all; }

      .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); min-width: 0; min-height: 0; display: flex; flex-direction: column; overflow: hidden; }
      .card-head { display: flex; align-items: center; gap: 10px; padding: 12px 14px 12px 18px; border-bottom: 1px solid var(--border); min-width: 0; }
      .card-title { font-size: 15px; font-weight: 700; margin: 0; display: flex; align-items: center; gap: 10px; white-space: nowrap; }
      .card-title svg { color: var(--gold); width: 18px; height: 18px; }
      .card-head .spacer { flex: 1; }
      .count { font-family: var(--mono); font-size: 11px; color: var(--text-3); background: var(--bg-2); border: 1px solid var(--border); border-radius: 99px; padding: 1px 8px; }

      .workspace { flex: 1; min-height: 0; display: grid; grid-template-columns: 260px 1fr; gap: 16px; }

      .list { flex: 1; overflow: auto; padding: 8px; display: grid; align-content: start; gap: 2px; }
      .list .empty { padding: 18px 10px; text-align: center; color: var(--text-3); font-size: 12.5px; }
      .list .item { position: relative; display: flex; align-items: center; gap: 10px; padding: 9px 10px; border-radius: 10px; color: var(--text-2); cursor: pointer; }
      .list .item svg { color: var(--text-3); }
      .list .item:hover { background: var(--surface-2); color: var(--text); }
      .list .item.active { background: var(--red-soft); color: var(--text); font-weight: 600; }
      .list .item.active svg { color: var(--gold); }
      .list .item.active::before { content: ""; position: absolute; left: -8px; top: 8px; bottom: 8px; width: 3px; border-radius: 0 3px 3px 0; background: var(--red); }
      .list .item .name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 13px; }
      .list .item .x { border: 0; background: none; color: var(--text-3); width: 24px; height: 24px; border-radius: 6px; display: grid; place-items: center; cursor: pointer; opacity: 0; padding: 0; }
      .list .item:hover .x, .list .item .x:focus-visible { opacity: 1; }
      .list .item .x:hover { color: #ff6b6f; background: var(--red-soft); }

      .editor-card .card-head { padding-left: 14px; }
      .name-field { flex: 1; min-width: 0; position: relative; }
      .name-field svg { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); color: var(--text-3); pointer-events: none; }
      .input { width: 100%; height: 32px; padding: 0 12px 0 34px; border-radius: 8px; border: 1px solid var(--border-strong); background: var(--bg-2); color: var(--text); outline: none; font-family: var(--mono); font-size: 12px; transition: border-color .12s; }
      .input:focus { border-color: var(--gold); }
      .editor-wrap { position: relative; flex: 1; min-height: 0; background: var(--bg-2); }
      #editor { position: absolute; inset: 0; }
      .editor-loading { position: absolute; inset: 0; display: grid; place-items: center; color: var(--text-3); font-size: 12.5px; }

      .console { flex: none; }
      .log { height: 120px; overflow: auto; font-family: var(--mono); font-size: 11.5px; line-height: 1.7; color: var(--text-2); padding: 8px 18px; background: var(--bg-2); }
      .log .t { color: var(--text-3); margin-right: 8px; }
      .log .err { color: #ff8a8d; }
      .log .ok { color: #86efac; }
      .log .empty { color: var(--text-3); }

      @media (max-width: 900px) {
        .workspace { grid-template-columns: 1fr; grid-template-rows: 150px minmax(260px, 1fr); }
      }
      @media (max-width: 640px) {
        body { overflow: auto; }
        .app { height: auto; min-height: 100%; }
        .x-head { padding: 12px 16px; min-height: 0; }
        .body { padding: 16px; }
        .workspace { grid-template-rows: 150px 380px; }
        .toolbar .btn { flex: 1; }
        .toolbar .spacer { display: none; }
        .toolbar .chip { width: 100%; justify-content: center; }
      }
    </style>
  </head>
  <body>
    <svg width="0" height="0" style="position:absolute" aria-hidden="true">
      <symbol id="i-terminal" viewBox="0 0 24 24"><path d="m7 11 2-2-2-2"/><path d="M11 13h4"/><rect width="18" height="18" x="3" y="3" rx="2"/></symbol>
      <symbol id="i-file" viewBox="0 0 24 24"><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/></symbol>
      <symbol id="i-folder" viewBox="0 0 24 24"><path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z"/></symbol>
      <symbol id="i-play" viewBox="0 0 24 24"><polygon points="6 3 20 12 6 21 6 3"/></symbol>
      <symbol id="i-syringe" viewBox="0 0 24 24"><path d="m18 2 4 4"/><path d="m17 7 3-3"/><path d="M19 9 8.7 19.3c-1 1-2.5 1-3.4 0l-.6-.6c-1-1-1-2.5 0-3.4L15 5"/><path d="m9 11 4 4"/><path d="m5 19-3 3"/><path d="m14 4 6 6"/></symbol>
      <symbol id="i-save" viewBox="0 0 24 24"><path d="M15.2 3a2 2 0 0 1 1.4.6l3.8 3.8a2 2 0 0 1 .6 1.4V19a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2z"/><path d="M17 21v-7a1 1 0 0 0-1-1H8a1 1 0 0 0-1 1v7"/><path d="M7 3v4a1 1 0 0 0 1 1h7"/></symbol>
      <symbol id="i-plus" viewBox="0 0 24 24"><path d="M5 12h14"/><path d="M12 5v14"/></symbol>
      <symbol id="i-x" viewBox="0 0 24 24"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></symbol>
      <symbol id="i-trash" viewBox="0 0 24 24"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/></symbol>
      <symbol id="i-alert" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" x2="12" y1="8" y2="12"/><line x1="12" x2="12.01" y1="16" y2="16"/></symbol>
      <symbol id="i-back" viewBox="0 0 24 24"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></symbol>
    </svg>

    <div class="app">
      <header class="x-head">
        <img src="./bope-180.png" alt="BOPE" draggable="false" />
        <div class="x-brand">
          <div class="t">B<span>.</span>O<span>.</span>P<span>.</span>E</div>
          <div class="s">Executor</div>
        </div>
        <div class="right">
          <a class="btn btn-sm btn-ghost" href="./#/executor"><svg class="i"><use href="#i-back"/></svg>Abrir no painel</a>
        </div>
      </header>

      <div class="body">
        <div class="toolbar">
          <div class="chip err" id="loader-pill"><span class="dot"></span><span id="loader-status">helper offline</span></div>
          <div class="spacer"></div>
          <button class="btn btn-gold" id="btn-inject"><svg class="i"><use href="#i-syringe"/></svg>Injetar</button>
          <button class="btn btn-primary" id="btn-run"><svg class="i"><use href="#i-play"/></svg>Executar <kbd>F5</kbd></button>
        </div>

        <div class="notice" id="offline-banner" role="alert">
          <svg class="i"><use href="#i-alert"/></svg>
          <div>
            <strong>Helper local não encontrado em <code>127.0.0.1:7962</code>.</strong>
            Abra o CMD e rode <code>cd C:\Program Files (x86)\Steam\steamui &amp;&amp; node 626.js</code>.
          </div>
        </div>

        <div class="workspace" id="pane-scripts">
          <section class="card">
            <div class="card-head">
              <h2 class="card-title"><svg class="i"><use href="#i-folder"/></svg>Scripts</h2>
              <span class="count" id="scripts-count">0</span>
              <div class="spacer"></div>
              <button class="btn btn-sm btn-ghost" id="btn-new" title="Novo script"><svg class="i"><use href="#i-plus"/></svg>Novo</button>
            </div>
            <div class="list" id="scripts-list"></div>
          </section>

          <section class="card editor-card">
            <div class="card-head">
              <div class="name-field">
                <svg class="i"><use href="#i-file"/></svg>
                <input type="text" class="input" id="script-name" placeholder="sem-nome.lua" spellcheck="false" autocomplete="off" />
              </div>
              <button class="btn btn-sm" id="btn-save" title="Salvar (Ctrl+S)"><svg class="i"><use href="#i-save"/></svg>Salvar</button>
            </div>
            <div class="editor-wrap">
              <div class="editor-loading" id="editor-loading">carregando editor…</div>
              <div id="editor"></div>
            </div>
          </section>
        </div>

        <section class="card console">
          <div class="card-head">
            <h2 class="card-title"><svg class="i"><use href="#i-terminal"/></svg>Console</h2>
            <div class="spacer"></div>
            <button class="btn btn-sm btn-ghost" id="btn-clear-log"><svg class="i"><use href="#i-trash"/></svg>Limpar</button>
          </div>
          <div class="log" id="log"><div class="empty">Nada por aqui ainda.</div></div>
        </section>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/monaco-editor@0.52.2/min/vs/loader.js"></script>
    <script src="./executor.js"></script>
  </body>
</html>
